[project]
name = "myleadtech-mcp"
version = "0.4.0"
description = "MyLeadTech HVAC MCP server (stdio): fault codes, model lookup and answers cited to the OEM manual page."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
myleadtech-mcp = "myleadtech_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myleadtech_mcp"]
